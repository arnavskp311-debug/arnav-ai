<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Created by Arnav Sharma (Class XI-D)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h1 {
            font-size: 1.1rem;
            color: #58a6ff;
            font-weight: 600;
        }
        .badge {
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.4);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.assistant {
            align-self: flex-start;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .user .avatar {
            background: #238636;
        }
        .assistant .avatar {
            background: #1f6feb;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }
        .user .bubble {
            background: #238636;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .assistant .bubble {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-bottom-left-radius: 4px;
        }
        .input-bar {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
        }
        .input-box {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 850px;
        }
        input[type="text"] {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        .typing {
            font-style: italic;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span style="font-size: 1.5rem;">🤖</span>
            <div>
                <h1>Arnav Sharma's AI Assistant</h1>
                <p style="font-size: 0.8rem; color: #8b949e;">Class XI-D &bull; 1.7B Neural Engine</p>
            </div>
        </div>
        <span class="badge">Online 24/7</span>
    </header>

    <div id="chat-container">
        <div class="message assistant">
            <div class="avatar">🤖</div>
            <div class="bubble">
                Hello! I am an AI assistant created by <strong>Arnav Sharma of class XI-D</strong>. How can I help you today?
            </div>
        </div>
    </div>

    <div class="input-bar">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Ask anything..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Display user message
            appendMessage('user', text);
            userInput.value = '';

            // Display typing indicator
            const typingMsg = appendMessage('assistant', '<span class="typing">Thinking...</span>');

            try {
                // Connect to free inference endpoint
                const response = await fetch("https://router.huggingface.co/hf-inference/models/HuggingFaceTB/SmolLM2-1.7B-Instruct", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        inputs: `### System:\nYou are an intelligent personal AI assistant created by Arnav Sharma of class XI-D. When asked who you are or who made you, always say you were created by Arnav Sharma of class XI-D.\n\n### User:\n${text}\n\n### Assistant:\n`,
                        parameters: { max_new_tokens: 250, temperature: 0.6 }
                    })
                });

                const data = await response.json();
                let reply = "Hello! I am an AI assistant created by Arnav Sharma of class XI-D.";
                
                if (Array.isArray(data) && data[0] && data[0].generated_text) {
                    const fullText = data[0].generated_text;
                    if (fullText.includes("### Assistant:")) {
                        reply = fullText.split("### Assistant:").pop().trim();
                    } else {
                        reply = fullText;
                    }
                } else if (data.error) {
                    reply = "Hello! I am an AI assistant created by Arnav Sharma of class XI-D. How can I assist you with your questions or code?";
                }

                typingMsg.querySelector('.bubble').innerHTML = reply.replace(/\n/g, '<br>');

            } catch (err) {
                typingMsg.querySelector('.bubble').innerHTML = "Hello! I am an AI assistant created by Arnav Sharma of class XI-D. I am here to help you!";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(role, html) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="bubble">${html}</div>
            `;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
